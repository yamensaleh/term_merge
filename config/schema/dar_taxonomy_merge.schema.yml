dar_taxonomy_merge.settings:
  type: config_object
  label: 'Taxonomy merge settings'
  mapping:
    vocabularies:
      type: sequence
      label: 'Mergeable vocabularies'
      sequence:
        type: string
        label: 'Vocabulary'
    batch_chunk_size:
      type: integer
      label: 'Entities processed per batch operation'
    drush_threshold:
      type: integer
      label: 'Record count above which Drush is recommended'
